name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/cloudvault

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            services/*/package-lock.json
            web/package-lock.json

      - name: Run Linting Checks
        run: |
          for dir in services/*; do
            if [ -f "$dir/package.json" ]; then
              echo "Checking $dir..."
              cd "$dir"
              npm ci --ignore-scripts --legacy-peer-deps
              if npm run | grep -q "lint"; then
                npm run lint
              fi
              cd - > /dev/null
            fi
          done

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - auth-service
          - files-service
          - upload-service
          - thumbnail-worker
          - notification-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Run test suite
        working-directory: services/${{ matrix.service }}
        run: npm test

  build-and-scan:
    name: Build, Scan & Publish
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - auth-service
          - files-service
          - upload-service
          - thumbnail-worker
          - notification-service
          - web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image context and tags
        id: meta
        run: |
          IMAGE_NAME=$(echo "${{ env.IMAGE_PREFIX }}-${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')
          CONTEXT_DIR="services/${{ matrix.service }}"
          if [ "${{ matrix.service }}" = "web" ]; then
            CONTEXT_DIR="web"
          fi
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "context_dir=${CONTEXT_DIR}" >> $GITHUB_OUTPUT
          echo "tag_sha=${IMAGE_NAME}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "tag_latest=${IMAGE_NAME}:latest" >> $GITHUB_OUTPUT

      - name: Build Docker image locally for scanning
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.meta.outputs.context_dir }}
          load: true
          tags: ${{ steps.meta.outputs.tag_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tag_sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ steps.meta.outputs.tag_sha }} ${{ steps.meta.outputs.tag_latest }}
          docker push ${{ steps.meta.outputs.tag_sha }}
          docker push ${{ steps.meta.outputs.tag_latest }}