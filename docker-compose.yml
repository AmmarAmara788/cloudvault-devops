# =============================================================================
# CloudVault — PRODUCTION-GRADE stack
# =============================================================================
name: cloudvault

# 1. Healthcheck Anchor
x-node-health: &node-health
  test: ["CMD-SHELL", "node -e \"fetch('http://localhost:' + process.env.PORT + '/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
  interval: 10s
  timeout: 3s
  retries: 10
  start_period: 20s

# 2. Production Security & Resources Anchor for Node Apps
x-app-defaults: &app-defaults
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  deploy:
    resources:
      limits:
        cpus: '0.5'
        memory: 256M
      reservations:
        cpus: '0.1'
        memory: 128M

networks:
  cloudvault:
    driver: bridge

volumes:
  auth-db-data:
  files-db-data:
  localstack-data:

services:
  # ------------------------------------------------------------------ data ---
  auth-db:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    restart: unless-stopped
    environment:
      # Removed clear-text fallbacks; must be provided securely via .env file
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cloudvault]

  files-db:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${FILES_DB_USER}
      POSTGRES_PASSWORD: ${FILES_DB_PASSWORD}
      POSTGRES_DB: ${FILES_DB_NAME}
    volumes:
      - files-db-data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FILES_DB_USER} -d ${FILES_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cloudvault]

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cloudvault]

  localstack:
    image: localstack/localstack:3@sha256:b279c01f4cfb8f985a482e4014cabc1e2697b9d7a6c8c8db2e40f4d9f93687c7
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEBUG: "0"
      PERSISTENCE: "1"
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q '\"s3\": \"available\"' || curl -fsS http://localhost:4566/_localstack/health"]
      interval: 8s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [cloudvault]

  # -------------------------------------------------------------- services ---
  auth-service:
    build: ./services/auth-service
    env_file: [.env]
    environment:
      PORT: "3001"
    <<: *app-defaults
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      #test: ["CMD-SHELL", "curl -fsS http://localhost:3001/healthz || exit 1"]
      <<: *node-health
    networks: [cloudvault]

  files-service:
    build: ./services/files-service
    env_file: [.env]
    environment:
      PORT: "3002"
    <<: *app-defaults
    depends_on:
      files-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      #test: ["CMD-SHELL", "curl -fsS http://localhost:3002/healthz || exit 1"]
      <<: *node-health
    networks: [cloudvault]

  upload-service:
    build: ./services/upload-service
    env_file: [.env]
    environment:
      PORT: "3003"
    <<: *app-defaults
    depends_on:
      files-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      #test: ["CMD-SHELL", "curl -fsS http://localhost:3003/healthz || exit 1"]
      <<: *node-health
    networks: [cloudvault]

  notification-service:
    build: ./services/notification-service
    env_file: [.env]
    environment:
      PORT: "3004"
    <<: *app-defaults
    depends_on:
      files-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      #test: ["CMD-SHELL", "curl -fsS http://localhost:3004/healthz || exit 1"]
      <<: *node-health
    networks: [cloudvault]

  thumbnail-worker:
    build: ./services/thumbnail-worker
    env_file: [.env]
    environment:
      PORT: "3005"
    <<: *app-defaults
    depends_on:
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      files-service:
        condition: service_healthy
    healthcheck:
      #test: ["CMD-SHELL", "curl -fsS http://localhost:3005/healthz || exit 1"]
      <<: *node-health
    networks: [cloudvault]

  gateway:
    build: ./services/gateway
    env_file: [.env]
    environment:
      PORT: "8080"
    <<: *app-defaults
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      files-service:
        condition: service_healthy
      upload-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      #test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      <<: *node-health
    networks: [cloudvault]

  # ------------------------------------------------------------------- web ---
  web:
    build: ./web
    env_file: [.env]
    environment:
      VITE_API_BASE: ${VITE_API_BASE}
    <<: *app-defaults
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    ports:
      - "5173:80" # Modified to match Nginx default port from the new Dockerfile
    depends_on:
      gateway:
        condition: service_healthy
    networks: [cloudvault]